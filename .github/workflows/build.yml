name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android project
        run: |
          set -o pipefail
          {
            flutter --version
            flutter create --org com.usman --project-name phone_cleaner --platforms=android /tmp/scaffold
            rm -rf android
            cp -r /tmp/scaffold/android ./android
            python3 tool/patch_android.py
            mkdir -p ~/.android
            cp android_overlay/debug.keystore ~/.android/debug.keystore
          } 2>&1 | tee build.log

      - name: Install sqlite for tests
        run: sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev 2>&1 | tee -a build.log

      - name: Pub get
        run: flutter pub get 2>&1 | tee -a build.log

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log

      - name: Test
        run: flutter test 2>&1 | tee -a build.log

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define=APP_VERSION=v1.0.${{ github.run_number }} 2>&1 | tee -a build.log

      - name: Verify signing key
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)/apksigner"
          EXPECTED=$(keytool -list -v -keystore android_overlay/debug.keystore -storepass android 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "expected $EXPECTED" | tee -a build.log
          for f in build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
            "$APKSIGNER" verify --min-sdk-version 24 "$f" 2>&1 | tee -a build.log
            ACTUAL=$("$APKSIGNER" verify --print-certs "$f" | grep -m1 'SHA-256 digest' | sed 's/.*: *//' | tr 'A-F' 'a-f')
            echo "actual   $ACTUAL ($f)" | tee -a build.log
            if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "SIGNING KEY MISMATCH" | tee -a build.log
              exit 1
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "PhoneCleaner-v$V-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "PhoneCleaner-v$V-arm32.apk"
          gh release create "v$V" "PhoneCleaner-v$V-arm64.apk" "PhoneCleaner-v$V-arm32.apk" \
            --title "Phone Cleaner v$V" \
            --notes "Install PhoneCleaner-v$V-arm64.apk (most phones). Use the arm32 file only if arm64 says it is not compatible. Updates install over the previous version." 2>&1 | tee -a build.log

      - name: Push logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          tail -n 300 build.log > /tmp/logs/build-tail.log 2>/dev/null || echo "no log" > /tmp/logs/build-tail.log
          echo "${{ job.status }} run ${{ github.run_number }} ${{ github.sha }}" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q -b build-logs
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git commit -qm "build log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-logs
